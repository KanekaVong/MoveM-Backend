apiVersion: apps/v1
kind: Deployment
metadata:
  name: movem-backend
  namespace: movem
  labels:
    app: movem-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movem-backend
  template:
    metadata:
      labels:
        app: movem-backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z movem-mysql-service 3306; do echo "waiting for mysql..."; sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: movem-backend
          image: us-central1-docker.pkg.dev/movem-cloud-2/movem-repo/movem-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Phnom_Penh"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Asia/Phnom_Penh"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: movem-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: movem-secrets
                  key: JWT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: movem-secrets
                  key: MAIL_USERNAME
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: movem-secrets
                  key: GMAIL_APP_PASSWORD
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: movem-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: FIREBASE_CREDENTIALS_PATH
              value: /etc/secrets/firebase/firebase-service-account.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/secrets/firebase
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: movem-secrets
            items:
              - key: firebase-service-account.json
                path: firebase-service-account.json

---
apiVersion: v1
kind: Service
metadata:
  name: movem-backend-service
  namespace: movem
spec:
  type: LoadBalancer
  selector:
    app: movem-backend
  ports:
    - port: 80
      targetPort: 8080
