spring.application.name=movem-backend


# Data Database Configuration
#spring.datasource.url=jdbc:mysql://movem-mysql-service:3306/movem
spring.datasource.url=jdbc:mysql://movem-mysql-service:3306/movem
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=Asia/Phnom_Penh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Phnom_Penh
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration
# 24 hours in milliseconds
app.jwt.expiration=86400000
# Replace this with your own long Base64 string!
# (You can generate one using an online Base64 generator)
app.jwt.secret=${JWT_SECRET}

# Trust Tokens
app.jwt.trust-expiration=259200000

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Activity cleanup
app.activity.retention-days=90

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

app.activity.retention-days=30

#upload limit
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Google Maps / Routes API
google.maps.api-key=${GOOGLE_MAPS_API_KEY}
google.maps.routes-url=https://routes.googleapis.com/directions/v2:computeRoutes
gcs.bucket-name=movem-cloud-2-uploads

#firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:./firebase-service-account.json}
